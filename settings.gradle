        google()
        mavenCentral()
        // Depot officiel de ksoap2-android (absent de Maven Central)
        maven { url 'https://oss.sonatype.org/content/repositories/ksoap2-android-releases' }
    }
}

rootProject.name = "SOAPCompteApp"
include ':app'
